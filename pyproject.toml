[project]
name = "subito-scraper"
version = "1.0.0"
description = "Open-source Subito.it real-estate scraper with keyword watches, SQLite history, alerts and a static dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Silvio Tacinelli" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
subito = "subito_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subito_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
